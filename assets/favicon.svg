<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mahak Jain">
  <!-- The brand mark: a 2x2 module grid with one square left open. -->
  <rect width="32" height="32" fill="#F9F8F6"/>
  <g transform="translate(4 4)">
    <rect x="0"    y="0"    width="10"  height="10"  fill="#002FA7"/>
    <rect x="15.2" y="1.2"  width="7.6" height="7.6" fill="none" stroke="#161616" stroke-width="2.4"/>
    <rect x="0"    y="14"   width="10"  height="10"  fill="#002FA7"/>
    <rect x="14"   y="14"   width="10"  height="10"  fill="#002FA7"/>
  </g>
</svg>
